name: Release Football News

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish optional manual-install ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate matching Git tag and Marketplace layout
        run: python scripts/check_marketplace.py --tag "$GITHUB_REF_NAME"
      - name: Verify Python integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frontend tests
        run: |
          for test in tests/*.mjs; do
            node "$test"
          done
      - name: Package integration files for manual installation
        run: python scripts/build_release.py
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: football_news.zip
          generate_release_notes: true
